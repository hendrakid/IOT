[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<main.cpp>

lib_deps =
    miguelbalboa/MFRC522 @ ^1.4.11
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11
    bblanchon/ArduinoJson @ ^7.4.1
    knolleary/PubSubClient @ ^2.8
    madhephaestus/ESP32Servo @ ^3.0.8

[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<main.cpp>
; Native USB-C (no CH340) — CDC must be enabled at boot for Serial to show in monitor.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; OLED omitted on C3 (GPIO budget) — status via Serial, LEDs, and buzzer.
lib_deps =
    miguelbalboa/MFRC522 @ ^1.4.11
    bblanchon/ArduinoJson @ ^7.4.1
    knolleary/PubSubClient @ ^2.8
    madhephaestus/ESP32Servo @ ^3.0.8

[env:esp32-c3-standalone]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<main_standalone.cpp>
; Native USB-C (no CH340) — CDC must be enabled at boot for Serial to show in monitor.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Standalone build: no WiFi/HTTP/MQTT/OLED, so only the RFID lib is needed.
lib_deps =
    miguelbalboa/MFRC522 @ ^1.4.11
    madhephaestus/ESP32Servo @ ^3.0.8
